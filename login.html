<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a2c42">
    <title>Dashboard — PYRAMID SNOOKER PALOR</title>
    <style>
        :root { color-scheme: light; --primary: #1a2c42; --secondary: #2d4263; --accent: #e8b832; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        main {
            width: min(100%, 560px);
            padding: clamp(24px, 6vw, 40px);
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .2);
            text-align: center;
        }
        .club-logo {
            display: block;
            width: 88px;
            height: 88px;
            object-fit: contain;
            margin: 0 auto 8px;
        }
        h1 { margin: 8px 0; font-size: clamp(1.5rem, 5vw, 2rem); }
        .welcome { color: #687386; }
        .session-card {
            margin: 28px 0 20px;
            padding: 18px;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            background: #f8f9fa;
            text-align: left;
        }
        .session-card p { margin: 6px 0; overflow-wrap: anywhere; }
        .label { color: #687386; }
        button {
            width: 100%;
            padding: 13px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: var(--secondary); }
        button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img class="club-logo" src="./pyramid_logo.svg" alt="PYRAMID SNOOKER PALOR logo">
        <h1>PYRAMID SNOOKER PALOR</h1>
        <p class="welcome" id="welcomeMessage">Loading your session…</p>
        <section class="session-card" aria-label="Session details">
            <p><span class="label">Profile:</span> <strong id="staffName"></strong></p>
            <p><span class="label">Role:</span> <strong id="staffRole"></strong></p>
            <p><span class="label">Signed in:</span> <strong id="loginTime"></strong></p>
        </section>
        <button type="button" id="logoutButton">Log out</button>
    </main>
    <script>
        const session = sessionStorage.getItem("currentStaff");
        if (!session) {
            window.location.replace("./index.html");
        } else {
            try {
                const staff = JSON.parse(session);
                if (!staff || typeof staff.name !== "string" || typeof staff.role !== "string") {
                    throw new Error("Invalid session");
                }
                document.getElementById("welcomeMessage").textContent = `Welcome, ${staff.name}`;
                document.getElementById("staffName").textContent = staff.name;
                document.getElementById("staffRole").textContent = staff.role;
                const loginDate = new Date(staff.loginTime);
                document.getElementById("loginTime").textContent = Number.isNaN(loginDate.getTime())
                    ? "Unknown"
                    : loginDate.toLocaleString();
            } catch {
                sessionStorage.removeItem("currentStaff");
                window.location.replace("./index.html");
            }
        }
        document.getElementById("logoutButton").addEventListener("click", () => {
            sessionStorage.removeItem("currentStaff");
            window.location.replace("./index.html");
        });
    </script>
</body>
</html>
