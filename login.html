<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CueClub Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a2c42;
            --secondary: #2d4263;
            --accent: #e8b832;
            --success: #28a745;
            --danger: #dc3545;
            --admin: #9333ea;
            --staff: #2563eb;
            --light: #f8f9fa;
        }
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
            padding: 32px 24px;
        }
        .app-logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .app-logo h2 {
            font-weight: 700;
            color: var(--primary);
            margin: 8px 0 4px;
            font-size: 1.5rem;
        }
        .app-logo p {
            color: #888;
            font-size: 0.9rem;
        }
        .staff-selector {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .staff-option {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .staff-option:hover { background: #f0f4ff; }
        .staff-option.selected {
            background: #e8f0fe;
            border: 2px solid var(--primary);
        }
        .role-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-admin { background: var(--admin); }
        .dot-staff { background: var(--staff); }
        .pin-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }
        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #ccc;
            transition: all 0.2s ease;
        }
        .pin-dot.filled {
            background: var(--primary);
            border-color: var(--primary);
        }
        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .num-btn {
            border: none;
            background: #e9ecef;
            border-radius: 10px;
            padding: 14px 8px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            transition: all 0.15s ease;
        }
        .num-btn:active {
            background: var(--primary);
            color: white;
            transform: scale(0.95);
        }
        .num-btn.sm {
            font-size: 0.8rem;
            background: transparent;
            border: 1px solid #ccc;
        }
        .login-btn {
            background: var(--success);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            transition: all 0.2s ease;
        }
        .login-btn:hover { background: #218838; }
        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .footer-info {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: #888;
        }
        .error-msg {
            text-align: center;
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
        .new-staff-btn {
            width: 100%;
            border: 1px dashed #ccc;
            background: transparent;
            border-radius: 8px;
            padding: 10px;
            color: #666;
            font-size: 0.85rem;
            margin-top: 8px;
            cursor: pointer;
        }
        .new-staff-btn:hover { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>

<div class="login-container">
    <div class="app-logo">
        <span style="font-size: 2.5rem;">🏪</span>
        <h2>Cue Lounge POS</h2>
        <p>Welcome Back! Please Select & Login</p>
    </div>

    <!-- Staff Selection -->
    <label class="form-label fw-semibold mb-2">Select Your Profile</label>
    <div class="staff-selector" id="staffSelector">
        <div class="staff-option selected" data-staff="admin" data-pin="9161">
            <div class="role-dot dot-admin"></div>
            <div>
                <div class="fw-semibold">Admin</div>
                <div class="small text-muted">Full Access</div>
            </div>
        </div>
        <div class="staff-option" data-staff="staff" data-pin="2131">
            <div class="role-dot dot-staff"></div>
            <div>
                <div class="fw-semibold">Staff</div>
                <div class="small text-muted">Sell & View Only</div>
            </div>
        </div>
    </div>
    <button class="new-staff-btn" onclick="alert('Contact Admin to add new staff members.')">
        <i class="fas fa-user-plus me-1"></i> Not Listed? Register New Staff
    </button>

    <!-- PIN Input -->
    <label class="form-label fw-semibold mb-0 mt-4">Enter PIN Code</label>
    <div class="pin-display" id="pinDisplay">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
    </div>
    <input type="hidden" id="pinInput" value="" maxlength="4">

    <!-- Numeric Keypad -->
    <div class="numpad">
        <button class="num-btn" onclick="inputPin('1')">1</button>
        <button class="num-btn" onclick="inputPin('2')">2</button>
        <button class="num-btn" onclick="inputPin('3')">3</button>
        <button class="num-btn" onclick="inputPin('4')">4</button>
        <button class="num-btn" onclick="inputPin('5')">5</button>
        
        <button class="num-btn" onclick="inputPin('6')">6</button>
        <button class="num-btn" onclick="inputPin('7')">7</button>
        <button class="num-btn" onclick="inputPin('8')">8</button>
        <button class="num-btn" onclick="inputPin('9')">9</button>
        <button class="num-btn" onclick="inputPin('0')">0</button>
        
        <button class="num-btn sm" onclick="clearPin()">
            <i class="fas fa-undo"></i> Clear
        </button>
        <button class="num-btn sm" onclick="deleteLast()">
            <i class="fas fa-backspace"></i> Delete
        </button>
    </div>

    <div class="error-msg" id="errorMsg">
        <i class="fas fa-exclamation-circle me-1"></i> Invalid PIN. Please try again.
    </div>

    <!-- Login Button -->
    <button class="login-btn" id="loginBtn" onclick="attemptLogin()" disabled>
        <i class="fas fa-lock-open me-1"></i> Login / Start Shift
    </button>

    <!-- Footer Info -->
    <div class="footer-info">
        <p class="mb-1">🕒 <span id="currentDateTime"></span></p>
        <p class="mb-0">🔒 Auto-lock: 5 minutes of inactivity</p>
    </div>
</div>

<script>
// ==========================================
// DATA & STATE
// ==========================================
let selectedStaff = {
    id: "admin",
    name: "Admin",
    pin: "9161",
    role: "admin"
};
let enteredPin = "";

// ==========================================
// STAFF SELECTION
// ==========================================
document.querySelectorAll(".staff-option").forEach(option => {
    option.addEventListener("click", function() {
        // Clear selection
        document.querySelectorAll(".staff-option").forEach(o => o.classList.remove("selected"));
        // Select this one
        this.classList.add("selected");
        
        const staffType = this.getAttribute("data-staff");
        const staffPin = this.getAttribute("data-pin");
        const staffName = this.querySelector(".fw-semibold").textContent;
        
        selectedStaff = {
            id: staffType,
            name: staffName,
            pin: staffPin,
            role: staffType
        };
        
        // Reset PIN
        clearPin();
    });
});

// ==========================================
// PIN HANDLING
// ==========================================
function inputPin(digit) {
    if (enteredPin.length >= 4) return;
    
    enteredPin += digit;
    updatePinDisplay();
    
    if (enteredPin.length === 4) {
        document.getElementById("loginBtn").disabled = false;
        setTimeout(attemptLogin, 250); // auto-login on correct PIN — no button press needed
    }
}

function deleteLast() {
    enteredPin = enteredPin.slice(0, -1);
    updatePinDisplay();
    document.getElementById("loginBtn").disabled = enteredPin.length !== 4;
}

function clearPin() {
    enteredPin = "";
    updatePinDisplay();
    document.getElementById("loginBtn").disabled = true;
    document.getElementById("errorMsg").style.display = "none";
}

function updatePinDisplay() {
    const dots = document.querySelectorAll(".pin-dot");
    dots.forEach((dot, i) => {
        if (i < enteredPin.length) {
            dot.classList.add("filled");
        } else {
            dot.classList.remove("filled");
        }
    });
}

// ==========================================
// LOGIN ATTEMPT
// ==========================================
function attemptLogin() {
    if (enteredPin.length !== 4) return;
    const PIN_ADMIN = "9161", PIN_STAFF = "2131";
    let role = null, name = null;
    if (enteredPin === PIN_ADMIN) { role = "admin"; name = "Admin"; }
    else if (enteredPin === PIN_STAFF) { role = "staff"; name = "Staff"; }

    if (role) {
        sessionStorage.setItem("cueclubLoggedIn", "true");
        sessionStorage.setItem("currentStaff", JSON.stringify({ name: name, role: role, loginTime: new Date().toISOString() }));
        document.getElementById("loginBtn").innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Logging in...';
        document.getElementById("errorMsg").style.display = "none";
        setTimeout(() => { window.location.href = "dashboard.html"; }, 500);
    } else {
        document.getElementById("errorMsg").style.display = "block";
        document.getElementById("loginBtn").disabled = true;
        document.querySelector(".login-container").animate([
            { transform: 'translateX(-5px)' },
            { transform: 'translateX(5px)' },
            { transform: 'translateX(-5px)' },
            { transform: 'translateX(0)' }
        ], { duration: 300 });
        clearPin();
    }
}

// ==========================================
// DATE & TIME
// ==========================================
function updateDateTime() {
    const now = new Date();
    const options = { 
        weekday: 'short', 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    };
    document.getElementById("currentDateTime").textContent = 
        now.toLocaleDateString('en-LK', options);
}
updateDateTime();
setInterval(updateDateTime, 60000);

// Keyboard support
document.addEventListener("keydown", function(e) {
    if (e.key >= '0' && e.key <= '9') {
        inputPin(e.key);
    } else if (e.key === "Backspace") {
        deleteLast();
    } else if (e.key === "Enter" && enteredPin.length === 4) {
        attemptLogin();
    }
});
</script>

</body>
</html>
