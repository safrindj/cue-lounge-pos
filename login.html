<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a2c42">
    <title>Staff sign in — PYRAMID SNOOKER PALOR</title>
    <style>
        :root { color-scheme: light; --primary: #1a2c42; --secondary: #2d4263; --accent: #e8b832; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        main {
            width: min(100%, 440px);
            padding: clamp(24px, 6vw, 40px);
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .2);
        }
        .brand-mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--primary);
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 800;
        }
        h1 { margin: 0; text-align: center; font-size: clamp(1.35rem, 5vw, 1.8rem); }
        .intro { margin: 8px 0 28px; color: #687386; text-align: center; }
        label { display: block; margin: 18px 0 7px; font-weight: 600; }
        input, select {
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid #cbd1d9;
            border-radius: 9px;
            background: white;
            color: var(--primary);
            font: inherit;
        }
        input:focus, select:focus { outline: 3px solid rgba(232, 184, 50, .45); border-color: var(--secondary); }
        button {
            width: 100%;
            margin-top: 26px;
            padding: 13px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: var(--secondary); }
        button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
        .error { min-height: 1.25em; margin: 12px 0 0; color: #a12626; }
    </style>
</head>
<body>
    <main>
        <div class="brand-mark" aria-hidden="true">P</div>
        <h1>PYRAMID SNOOKER PALOR</h1>
        <p class="intro">Sign in to start your staff session.</p>
        <form id="loginForm">
            <label for="staffName">Staff name</label>
            <input id="staffName" name="staffName" type="text" autocomplete="name" maxlength="80" required>
            <label for="staffRole">Role</label>
            <select id="staffRole" name="staffRole" required>
                <option value="" disabled selected>Select your role</option>
                <option value="Manager">Manager</option>
                <option value="Receptionist">Receptionist</option>
                <option value="Staff">Staff</option>
            </select>
            <p class="error" id="loginError" role="alert" aria-live="polite"></p>
            <button type="submit">Sign in</button>
        </form>
    </main>
    <script>
        // ✅ FIX: check BOTH session keys — if either exists, user is logged in
        function isLoggedIn() {
            return sessionStorage.getItem("cueclubLoggedIn") === "true"
                || sessionStorage.getItem("currentStaff") !== null;
        }

        if (isLoggedIn()) {
            window.location.replace("./dashboard.html");
        }

        document.getElementById("loginForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const name = document.getElementById("staffName").value.trim();
            const role = document.getElementById("staffRole").value;
            if (!name || !role) {
                document.getElementById("loginError").textContent = "Enter your name and select a role.";
                return;
            }
            try {
                const staffData = JSON.stringify({
                    name,
                    role,
                    loginTime: new Date().toISOString()
                });
                // ✅ FIX: set BOTH keys so every page's auth check passes
                sessionStorage.setItem("currentStaff", staffData);
                sessionStorage.setItem("cueclubLoggedIn", "true");

                window.location.assign("./dashboard.html");
            } catch {
                document.getElementById("loginError").textContent = "Your session could not be saved. Please try again.";
            }
        });
    </script>
</body>
</html>
