<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers — CueClub Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a2c42;
            --secondary: #2d4263;
            --accent: #e8b832;
            --success: #28a745;
            --danger: #dc3545;
            --bronze: #cd7f32;
            --silver: #c0c0c0;
            --gold: #ffd700;
            --vip: #9c27b0;
        }
        body { background: #f0f2f5; min-height: 100vh; padding-bottom: 40px; }
        .header-bar { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 14px 20px; position: sticky; top:0; z-index: 100; }
        .back-link { color: white; text-decoration: none; margin-right: 12px; }
        .customer-card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s; }
        .customer-card:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .loyalty-badge { border-radius: 20px; padding: 2px 10px; font-size: 0.75rem; font-weight: 600; }
        .loyalty-bronze { background: var(--bronze); color: white; }
        .loyalty-silver { background: var(--silver); color: #333; }
        .loyalty-gold { background: var(--gold); color: #333; }
        .loyalty-vip { background: var(--vip); color: white; }
        .stat-box { background: white; border-radius: 10px; padding: 16px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .stat-number { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .history-item { padding: 10px 12px; border-bottom: 1px solid #eee; }
        .history-item:last-child { border-bottom: none; }
        .bill-amount { font-weight: 600; color: var(--primary); }
        .search-box { position: relative; }
        .search-box input { padding-left: 38px; border-radius: 8px; border: 1px solid #ddd; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888; }
        .view-container { display: none; }
        .list-container { display: block; }
        .active-view .list-container { display: none; }
        .active-view .view-container { display: block; }
        .progress-bar-custom { height: 8px; border-radius: 4px; background: #eee; }
        .progress-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--bronze), var(--silver), var(--gold)); width: 0%; }
    </style>
</head>
<body>
<!-- 🔐 PAGE PROTECTION -->
<script>
function checkAuth() {
  const isLoggedIn = (sessionStorage.getItem("cueclubLoggedIn") === "true" || sessionStorage.getItem("currentStaff") !== null);
  if (!isLoggedIn) { window.location.replace("login.html"); }
}
checkAuth();
</script>

<!-- Header -->
<div class="header-bar d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center">
        <a href="dashboard.html" class="back-link" id="backBtn"><i class="fas fa-arrow-left"></i></a>
        <h5 class="mb-0" id="pageTitle"><i class="fas fa-users me-2"></i> Customers</h5>
    </div>
    <button class="btn btn-sm btn-light" id="addCustomerBtn" onclick="openNewCustomerModal()">
        <i class="fas fa-user-plus me-1"></i> New
    </button>
</div>

<div class="container px-3 mt-4" id="mainWrapper">

    <!-- CUSTOMER LIST VIEW -->
    <div class="list-container">
        <!-- Search -->
        <div class="search-box mb-3">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="form-control" placeholder="Search by name or mobile..." onkeyup="filterCustomers()">
        </div>

        <!-- Stats Summary -->
        <div class="row g-2 mb-3">
            <div class="col-4">
                <div class="stat-box">
                    <div class="stat-number" id="totalCustomers">0</div>
                    <div class="small text-muted">Total</div>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-box">
                    <div class="stat-number" id="todayVisits">0</div>
                    <div class="small text-muted">Today</div>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-box">
                    <div class="stat-number" id="topTier">—</div>
                    <div class="small text-muted">Top Tier</div>
                </div>
            </div>
        </div>

        <!-- Customer List -->
        <div id="customerList">
            <!-- Loaded by JavaScript -->
        </div>
    </div>

    <!-- CUSTOMER DETAIL VIEW -->
    <div class="view-container" id="detailView">
        <button class="btn btn-sm btn-secondary mb-3" onclick="goBack()"><i class="fas fa-arrow-left me-1"></i> Back to Customer List</button>
        <!-- Profile Card -->
        <div class="card mb-3 border-0 shadow-sm">
            <div class="card-body text-center">
                <div class="display-1 text-muted mb-2"><i class="fas fa-user-circle"></i></div>
                <h4 id="detailName">—</h4>
                <p class="text-muted mb-2" id="detailMobile"><i class="fas fa-mobile-alt me-2"></i>—</p>
                <p class="small text-muted mb-3" id="detailSince">Member since: —</p>
                
                <span class="loyalty-badge" id="detailLoyalty">Guest</span>
                <div class="mt-2">
                    <strong id="detailPoints">0 Points</strong>
                    <div class="progress-bar-custom mt-2">
                        <div class="progress-fill" id="pointsProgress" style="width: 0%;"></div>
                    </div>
                    <small class="text-muted">1,000 pts to VIP</small>
                </div>
            </div>
        </div>

        <!-- Key Stats -->
        <div class="row g-2 mb-3">
            <div class="col-6">
                <div class="stat-box">
                    <div class="stat-number" id="detailSpent">Rs. 0</div>
                    <div class="small text-muted">Total Spent</div>
                </div>
            </div>
            <div class="col-6">
                <div class="stat-box">
                    <div class="stat-number" id="detailVisits">0</div>
                    <div class="small text-muted">Total Visits</div>
                </div>
            </div>
        </div>

        <!-- Visit/Bill History -->
        <h6 class="mb-2"><i class="fas fa-history me-2"></i> Visit & Bill History</h6>
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body p-0">
                <div id="historyList">
                    <!-- History loaded here -->
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex gap-2 mb-4">
            <button class="btn btn-primary flex-grow-1" onclick="editCustomer()">
                <i class="fas fa-edit me-1"></i> Edit
            </button>
            <button class="btn btn-outline-danger flex-grow-1" onclick="deleteCustomer()">
                <i class="fas fa-trash-alt me-1"></i> Delete
            </button>
        </div>
    </div>

</div>

<!-- NEW/EDIT CUSTOMER MODAL -->
<div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add New Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Full Name *</label>
                    <input type="text" id="custName" class="form-control" placeholder="e.g. Perera, K.">
                </div>
                <div class="mb-3">
                    <label class="form-label">Customer ID <span class="text-muted small">(auto-generated)</span></label>
                    <input type="text" id="custId" class="form-control" readonly style="background:#f0f4ff;font-weight:600;">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mobile Number *</label>
                    <input type="tel" id="custMobile" class="form-control" placeholder="07X-XXXXXXX">
                </div>
                <div class="mb-3">
                    <label class="form-label">WhatsApp (optional)</label>
                    <input type="tel" id="custWhatsapp" class="form-control" placeholder="Same as mobile if blank">
                </div>
                <div class="mb-3">
                    <label class="form-label">Notes / Reference</label>
                    <textarea id="custNotes" class="form-control" rows="2" placeholder="Any notes..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Loyalty Discount % <span class="text-muted small">(admin override — leave blank for auto by spend)</span></label>
                    <input type="number" id="custManualDiscount" class="form-control" placeholder="e.g. 15" min="0" max="100" step="1">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" id="modalSaveBtn">Save Customer</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ✅ Google Apps Script Deployment URL
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzR0w9MVxhK0VS4ufmbm8vxe1dmZvxb7w1lvsyg_7Neqh-adyolxRvJF1CnE2nO5wYkA/exec";

const CUSTOMERS_KEY = "cueclubCustomers";
let customers = [];
let currentCustomerId = null;
let customerModal;

// Loyalty Rules
const loyaltyTiers = {
    none: { name: 'Guest', stars: 0, minSpent: 0, discount: 0, badgeClass: '' },
    bronze: { name: 'Bronze', stars: 1, minSpent: 1000, discount: 5, badgeClass: 'loyalty-bronze' },
    silver: { name: 'Silver', stars: 2, minSpent: 5000, discount: 10, badgeClass: 'loyalty-silver' },
    gold: { name: 'Gold', stars: 3, minSpent: 15000, discount: 15, badgeClass: 'loyalty-gold' },
    vip: { name: 'VIP', stars: 4, minSpent: 50000, discount: 20, badgeClass: 'loyalty-vip' }
};

const _DEFAULT_CUSTOMERS = [
    { id: "P0050", name: "Perera K.", mobile: "071-9876543", whatsapp: "", notes: "", manualDiscount: null, totalSpent: 0, totalVisits: 0, points: 0, regDate: new Date().toISOString(), history: [] },
    { id: "P0051", name: "Silva S.", mobile: "077-1234567", whatsapp: "", notes: "", manualDiscount: null, totalSpent: 0, totalVisits: 0, points: 0, regDate: new Date().toISOString(), history: [] },
    { id: "P0052", name: "Jayasuriya M.", mobile: "076-5551234", whatsapp: "", notes: "", manualDiscount: null, totalSpent: 0, totalVisits: 0, points: 0, regDate: new Date().toISOString(), history: [] },
    { id: "P0053", name: "Fernando R.", mobile: "070-8889999", whatsapp: "", notes: "", manualDiscount: null, totalSpent: 0, totalVisits: 0, points: 0, regDate: new Date().toISOString(), history: [] }
];

function escapeHtml(v){ return String(v==null?"":v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function formatDate(d){
    if(!d) return "—";
    const date = new Date(d);
    return Number.isNaN(date.getTime()) ? "—" : date.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

function loadCustomers(){
    try {
        const saved = localStorage.getItem(CUSTOMERS_KEY);
        if(saved){
            const parsed = JSON.parse(saved);
            customers = Array.isArray(parsed) ? parsed.filter(c => c && typeof c === "object" && !Array.isArray(c)).map(c => ({
                ...c,
                name: String(c.name ?? ""),
                mobile: String(c.mobile ?? ""),
                totalSpent: Number.isFinite(Number(c.totalSpent)) ? Number(c.totalSpent) : 0,
                totalVisits: Number.isFinite(Number(c.totalVisits)) ? Number(c.totalVisits) : 0,
                points: Number.isFinite(Number(c.points)) ? Number(c.points) : 0,
                history: Array.isArray(c.history) ? c.history : []
            })) : [];
        } else {
            customers = _DEFAULT_CUSTOMERS.slice();
            saveCustomers();
        }
    } catch(e){ customers = []; }
}

function saveCustomers(){
    try { localStorage.setItem(CUSTOMERS_KEY, JSON.stringify(customers)); } catch(e){}
    // Optional: Sync to Google Sheets
    if(GOOGLE_SCRIPT_URL){
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveCustomers', items: customers })
        }).catch(()=>{});
    }
}

function nextCustomerId(){
    let max = 49;
    customers.forEach(c => {
        if(c && c.id){
            const m = String(c.id).match(/^P(\d+)$/);
            if(m) max = Math.max(max, parseInt(m[1],10));
        }
    });
    return "P" + String(max + 1).padStart(4, "0");
}

function getLoyaltyTier(totalSpent){
    const tiers = Object.entries(loyaltyTiers);
    for(let i = tiers.length-1; i >= 0; i--){
        if(Number(totalSpent) >= tiers[i][1].minSpent) return tiers[i][1];
    }
    return loyaltyTiers.none;
}

window.loadCustomers = loadCustomers;

// INIT
window.onload = function(){
    customerModal = new bootstrap.Modal(document.getElementById('customerModal'));
    loadCustomers();
    renderCustomerList();
    updateStats();
};

function renderCustomerList(filterText = ""){
    const container = document.getElementById("customerList");
    container.innerHTML = "";
    
    let filtered = customers;
    if(filterText){
        const ft = filterText.toLowerCase();
        filtered = customers.filter(c => {
            if(!c || typeof c !== "object") return false;
            const name = String(c.name ?? "").toLowerCase();
            const mobile = String(c.mobile ?? "").toLowerCase();
            return name.includes(ft) || mobile.includes(ft);
        });
    }
    
    if(!filtered.length){
        container.innerHTML = '<div class="text-center text-muted py-4">No customers found.</div>';
        return;
    }
    
    filtered.forEach(cust => {
        const tier = getLoyaltyTier(cust.totalSpent);
        const stars = "⭐".repeat(tier.stars);
        const card = document.createElement("div");
        card.className = "customer-card";
        card.setAttribute("role", "button");
        card.tabIndex = 0;
        card.innerHTML = `
            <div class="d-flex justify-content-between align-items-start gap-2">
                <div>
                    <h6 class="mb-1">${escapeHtml(cust.name)}</h6>
                    <div class="small text-muted"><i class="fas fa-mobile-alt me-1"></i>${escapeHtml(cust.mobile)}</div>
                </div>
                <span class="loyalty-badge ${tier.badgeClass}">${tier.name}${stars ? ` ${stars}` : ""}</span>
            </div>
            <div class="d-flex justify-content-between mt-2 small text-muted">
                <span>${cust.totalVisits} visits</span>
                <span>Rs. ${Number(cust.totalSpent).toLocaleString()}</span>
            </div>`
