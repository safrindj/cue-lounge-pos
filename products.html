<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — CueClub Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a2c42;
            --secondary: #2d4263;
            --accent: #e8b832;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --light: #f8f9fa;
        }
        body { background: #f0f2f5; min-height: 100vh; padding-bottom: 40px; }
        .header-bar { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 14px 20px; position: sticky; top:0; z-index: 100; }
        .back-link { color: white; text-decoration: none; margin-right: 12px; }
        .product-card { background: white; border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: all 0.2s; }
        .product-card:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .product-card.low-stock { border-left: 4px solid var(--danger); }
        .product-card.quick-sell { border-left: 4px solid var(--success); }
        .product-name { font-weight: 600; font-size: 1rem; }
        .product-emoji { font-size: 1.5rem; margin-right: 10px; }
        .price-tag { background: var(--primary); color: white; font-weight: 600; border-radius: 20px; padding: 3px 10px; font-size: 0.85rem; }
        .stock-badge { font-size: 0.8rem; border-radius: 12px; padding: 2px 8px; }
        .stock-good { background: #d4edda; color: #155724; }
        .stock-low { background: #f8d7da; color: #721c24; }
        .category-title { font-size: 0.95rem; font-weight: 600; color: #555; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-add-product { background: var(--success); color: white; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 500; }
        .btn-add-product:hover { background: #218838; }
        .btn-edit { color: #666; border: none; background: none; font-size: 0.9rem; }
        .btn-delete { color: var(--danger); border: none; background: none; font-size: 0.9rem; }
        .search-box { position: relative; }
        .search-box input { padding-left: 38px; border-radius: 8px; border: 1px solid #ddd; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888; }
        .filter-tab { padding: 6px 14px; border-radius: 20px; border: none; background: #e9ecef; font-size: 0.85rem; margin-right: 6px; margin-bottom: 6px; }
        .filter-tab.active { background: var(--primary); color: white; }
        .low-stock-alert { background: #fff3cd; border: 1px solid #ffeeba; border-radius: 8px; padding: 10px 14px; margin-bottom: 15px; color: #856404; }
        .modal-content { border-radius: 12px; }
    </style>
</head>
<body>
<!-- 🔐 PAGE PROTECTION -->
<script>
function checkAuth() {
  const isLoggedIn = (sessionStorage.getItem("cueclubLoggedIn") === "true" || sessionStorage.getItem("currentStaff") !== null);
  if (!isLoggedIn) {
    window.location.replace("login.html");
  }
}
checkAuth();
</script>

<!-- Header -->
<div class="header-bar d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center">
        <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i></a>
        <h5 class="mb-0"><i class="fas fa-boxes me-2"></i> Products</h5>
    </div>
    <button class="btn btn-sm btn-light" onclick="openAddProductModal()">
        <i class="fas fa-plus me-1"></i> Add
    </button>
</div>

<div class="container px-3 mt-4">

    <!-- Search & Filters -->
    <div class="search-box mb-3">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="form-control" placeholder="Search products..." onkeyup="filterProducts()">
    </div>

    <div class="d-flex flex-wrap mb-3">
        <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">📦 All</button>
        <button class="filter-tab" data-filter="quicksell" onclick="setFilter('quicksell')">⚡ Quick-Sell</button>
        <button class="filter-tab" data-filter="lowstock" onclick="setFilter('lowstock')">⚠️ Low Stock</button>
    </div>

    <!-- Low Stock Alerts -->
    <div id="lowStockAlertBox" class="low-stock-alert d-none">
        <strong>⚠️ Stock Alert:</strong> Some items need restocking!
    </div>

    <!-- Product List -->
    <div id="productContainer">
        <!-- Rendered by JavaScript -->
    </div>

</div>

<!-- ADD/EDIT PRODUCT MODAL -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add New Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editProductId">
                <div class="mb-3">
                    <label class="form-label">Product Name *</label>
                    <input type="text" id="prodName" class="form-control" placeholder="e.g. Coca-Cola">
                </div>
                <div class="mb-3">
                    <label class="form-label">Category *</label>
                    <select id="prodCategory" class="form-select">
                        <option value="Beverages">🥤 Beverages</option>
                        <option value="Snacks">🍟 Snacks</option>
                        <option value="Accessories">🧰 Accessories</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Emoji Icon</label>
                    <input type="text" id="prodEmoji" class="form-control" placeholder="🥤" maxlength="2">
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">Selling Price (Rs.) *</label>
                        <input type="number" id="prodPrice" class="form-control" placeholder="250">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Cost Price (Rs.)</label>
                        <input type="number" id="prodCost" class="form-control" placeholder="150">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">Current Stock *</label>
                        <input type="number" id="prodStock" class="form-control" placeholder="50">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Low Stock Alert Level</label>
                        <input type="number" id="prodLowStock" class="form-control" placeholder="10" value="10">
                    </div>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="prodQuickSell">
                    <label class="form-check-label">Show on Quick-Sell buttons</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="saveProduct()">Save Product</button>
            </div>
        </div>
    </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this product?</p>
                <strong id="deleteProductName"></strong>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ✅ Google Apps Script Deployment URL
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzR0w9MVxhK0VS4ufmbm8vxe1dmZvxb7w1lvsyg_7Neqh-adyolxRvJF1CnE2nO5wYkA/exec";

const PRODUCTS_KEY = "cueclubProducts";

// Default Products Data
const DEFAULT_PRODUCTS = [
    { id: "P01", name: "Coca-Cola", category: "Beverages", emoji: "🥤", price: 250, cost: 160, stock: 45, lowStockLevel: 10, quickSell: true },
    { id: "P02", name: "Pepsi", category: "Beverages", emoji: "🥤", price: 250, cost: 155, stock: 32, lowStockLevel: 10, quickSell: true },
    { id: "P03", name: "Water Bottle", category: "Beverages", emoji: "💧", price: 150, cost: 80, stock: 120, lowStockLevel: 20, quickSell: true },
    { id: "P04", name: "Hot Coffee", category: "Beverages", emoji: "☕", price: 300, cost: 180, stock: 18, lowStockLevel: 10, quickSell: true },
    { id: "P05", name: "Cue Chalk", category: "Accessories", emoji: "🧱", price: 100, cost: 40, stock: 8, lowStockLevel: 15, quickSell: true },
    { id: "P06", name: "Cue Tip", category: "Accessories", emoji: "⚪", price: 80, cost: 25, stock: 20, lowStockLevel: 10, quickSell: false },
    { id: "P07", name: "Potato Chips", category: "Snacks", emoji: "🍟", price: 180, cost: 90, stock: 25, lowStockLevel: 8, quickSell: false },
    { id: "P08", name: "Chocolate Bar", category: "Snacks", emoji: "🍫", price: 120, cost: 55, stock: 0, lowStockLevel: 5, quickSell: false }
];

let products = [];
let currentFilter = "all";
let productModal, deleteModal;
let deleteTargetId = null;

function loadProducts() {
    try {
        const saved = localStorage.getItem(PRODUCTS_KEY);
        if (saved === null) {
            products = DEFAULT_PRODUCTS.map(product => ({ ...product }));
            saveProducts();
            return;
        }

        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) throw new Error("Saved products must be an array");

        const usedIds = new Set();
        products = parsed.filter(item => item && typeof item === "object").map((item, index) => {
            let id = String(item.id ?? "").trim();
            if (!id || usedIds.has(id)) id = `PRODUCT-${index + 1}`;
            while (usedIds.has(id)) id += "-1";
            usedIds.add(id);

            const numberOr = (value, fallback) => {
                const number = Number(value);
                return Number.isFinite(number) && number >= 0 ? number : fallback;
            };
            return {
                id,
                name: String(item.name ?? "").trim(),
                category: String(item.category ?? "Other"),
                emoji: String(item.emoji ?? "📦"),
                price: numberOr(item.price, 0),
                cost: numberOr(item.cost, 0),
                stock: numberOr(item.stock, 0),
                lowStockLevel: numberOr(item.lowStockLevel, 10),
                quickSell: item.quickSell === true || item.quickSell === "true"
            };
        }).filter(item => item.name);
    } catch (e) {
        products = DEFAULT_PRODUCTS.map(product => ({ ...product }));
        saveProducts();
    }
}

function saveProducts() {
    try {
        localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
    } catch (e) {
        console.warn("Products could not be saved in this browser.", e);
    }

    // Optional: Sync to Google Sheets
    if (GOOGLE_SCRIPT_URL) {
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveProducts', items: products })
        }).catch(() => {});
    }
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
}

// INIT
window.onload = function() {
    productModal = new bootstrap.Modal(document.getElementById('productModal'));
    deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

    document.getElementById("productContainer").addEventListener("click", event => {
        const button = event.target.closest("[data-product-action]");
        if (!button) return;
        if (button.dataset.productAction === "edit") editProduct(button.dataset.productId);
        if (button.dataset.productAction === "delete") openDeleteModal(button.dataset.productId);
    });

    loadProducts();
    renderProducts();
    checkLowStock();
};

// RENDER & FILTER
function renderProducts() {
    const container = document.getElementById("productContainer");
    const filtered = getFilteredProducts();
    const grouped = {};

    filtered.forEach(p => {
        if (!grouped[p.category]) grouped[p.category] = [];
        grouped[p.category].push(p);
    });

    container.innerHTML = "";
    if (filtered.length === 0) {
        container.innerHTML = '<p class="text-center text-muted py-4">No products found.</p>';
        return;
    }

    Object.keys(grouped).sort().forEach(cat => {
        container.innerHTML += `<h6 class="category-title">${escapeHTML(cat)}</h6>`;
        grouped[cat].forEach(p => {
            const isLow = Number(p.stock) <= Number(p.lowStockLevel);
            const stockClass = isLow ? "stock-low" : "stock-good";
            const cardClass = (isLow ? "low-stock " : "") + (p.quickSell ? "quick-sell" : "");
            
            container.innerHTML += `
                <div class="product-card ${cardClass}">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <span class="product-emoji">${escapeHTML(p.emoji || "📦")}</span>
                            <div>
                                <div class="product-name">${escapeHTML(p.name)}</div>
                                <div class="d-flex align-items-center gap-2 mt-1">
                                    <span class="price-tag">Rs. ${Number(p.price).toLocaleString()}</span>
                                    <span class="stock-badge ${stockClass}">
                                        ${isLow ? '⚠️ ' : ''}Stock: ${p.stock}
                                    </span>
                                    ${p.quickSell ? '<span class="text-success small">⚡</span>' : ''}
                                </div>
                            </div>
                        </div>
                        <div class="d-flex flex-column">
                            <button class="btn-edit" type="button" data-product-action="edit" data-product-id="${escapeHTML(p.id)}" aria-label="Edit ${escapeHTML(p.name)}"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete" type="button" data-product-action="delete" data-product-id="${escapeHTML(p.id)}" aria-label="Delete ${escapeHTML(p.name)}"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;
        });
    });
}

function getFilteredProducts() {
    let list = [...products];
    const search = document.getElementById("searchInput").value.trim().toLowerCase();

    if (search) list = list.filter(p => String(p.name ?? "").toLowerCase().includes(search));
    if (currentFilter === "quicksell") list = list.filter(p => p.quickSell);
    if (currentFilter === "lowstock") list = list.filter(p => Number(p.stock) <= Number(p.lowStockLevel));

    return list;
}

function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    renderProducts();
}

function filterProducts() {
    renderProducts();
}

function checkLowStock() {
    const lowItems = products.filter(p => Number(p.stock) <= Number(p.lowStockLevel) && Number(p.stock) > 0);
    const outItems = products.filter(p => Number(p.stock) <= 0);
        const alertBox = document.getElementById("lowStockAlertBox");
    const total = lowItems.length + outItems.length;
    alertBox.classList.toggle("d-none", total === 0);
    if (total > 0) {
        const messages = [];
        if (lowItems.length) messages.push(`${lowItems.length} item${lowItems.length === 1 ? "" : "s"} running low`);
        if (outItems.length) messages.push(`${outItems.length} item${outItems.length === 1 ? "" : "s"} out of stock`);
        alertBox.innerHTML = `<strong>⚠️ Stock Alert:</strong> ${messages.join("; ")}.`;
    }
}

function openAddProductModal() {
    document.getElementById("modalTitle").textContent = "Add New Product";
    document.getElementById("editProductId").value = "";
    document.getElementById("prodName").value = "";
    document.getElementById("prodCategory").value = "Beverages";
    document.getElementById("prodEmoji").value = "";
    document.getElementById("prodPrice").value = "";
    document.getElementById("prodCost").value = "";
    document.getElementById("prodStock").value = "";
    document.getElementById("prodLowStock").value = "10";
    document.getElementById("prodQuickSell").checked = false;
    productModal.show();
}

function editProduct(id) {
    const product = products.find(item => item.id === id);
    if (!product) return;

    document.getElementById("modalTitle").textContent = "Edit Product";
    document.getElementById("editProductId").value = product.id;
    document.getElementById("prodName").value = product.name;
    document.getElementById("prodCategory").value = product.category;
    document.getElementById("prodEmoji").value = product.emoji;
    document.getElementById("prodPrice").value = product.price;
    document.getElementById("prodCost").value = product.cost;
    document.getElementById("prodStock").value = product.stock;
    document.getElementById("prodLowStock").value = product.lowStockLevel;
    document.getElementById("prodQuickSell").checked = product.quickSell;
    productModal.show();
}

function saveProduct() {
    const name = document.getElementById("prodName").value.trim();
    const priceValue = document.getElementById("prodPrice").value.trim();
    const stockValue = document.getElementById("prodStock").value.trim();
    const costValue = document.getElementById("prodCost").value.trim();
    const lowValue = document.getElementById("prodLowStock").value.trim();
    const price = Number(priceValue);
    const stock = Number(stockValue);
    const cost = costValue === "" ? 0 : Number(costValue);
    const lowStockLevel = lowValue === "" ? 10 : Number(lowValue);

    if (!name || priceValue === "" || stockValue === "" ||
        !Number.isFinite(price) || price < 0 ||
        !Number.isInteger(stock) || stock < 0 ||
        !Number.isFinite(cost) || cost < 0 ||
        !Number.isInteger(lowStockLevel) || lowStockLevel < 0) {
        alert("Enter a product name, a valid non-negative price, and whole-number stock and alert levels. Cost must also be non-negative.");
        return;
    }

    const id = document.getElementById("editProductId").value;
    const product = {
        id: id || `P-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
        name,
        category: document.getElementById("prodCategory").value,
        emoji: document.getElementById("prodEmoji").value.trim() || "📦",
        price,
        cost,
        stock,
        lowStockLevel,
        quickSell: document.getElementById("prodQuickSell").checked
    };

    const existingIndex = products.findIndex(item => item.id === id);
    if (existingIndex >= 0) products[existingIndex] = product;
    else products.push(product);

    saveProducts();
    renderProducts();
    checkLowStock();
    productModal.hide();
}

function openDeleteModal(id) {
    const product = products.find(item => item.id === id);
    if (!product) return;
    deleteTargetId = id;
    document.getElementById("deleteProductName").textContent = product.name;
    deleteModal.show();
}

function confirmDelete() {
    if (deleteTargetId === null) return;
    products = products.filter(item => item.id !== deleteTargetId);
    deleteTargetId = null;
    saveProducts();
    renderProducts();
    checkLowStock();
    deleteModal.hide();
}
</script>
</body>
</html>
