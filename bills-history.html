<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bills & Transaction History — CueClub Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a2c42;
            --secondary: #2d4263;
            --accent: #e8b832;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --light: #f8f9fa;
        }
        body { background: #f0f2f5; min-height: 100vh; padding-bottom: 40px; }
        .header-bar { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 14px 20px; position: sticky; top:0; z-index: 100; }
        .back-link { color: white; text-decoration: none; margin-right: 12px; }
        .bill-card { background: white; border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: all 0.2s; cursor: pointer; }
        .bill-card:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .bill-number { font-family: monospace; font-weight: 600; color: var(--primary); background: #e9ecef; padding: 2px 8px; border-radius: 4px; font-size: 0.9rem; }
        .status-paid { color: var(--success); }
        .status-pending { color: var(--warning); }
        .status-credit { color: var(--danger); }
        .amount-lg { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .search-box { position: relative; }
        .search-box input { padding-left: 38px; border-radius: 8px; border: 1px solid #ddd; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888; }
        .filter-select { border-radius: 20px; padding: 4px 12px; border: 1px solid #ddd; background: white; font-size: 0.85rem; }
        .action-btn { border: none; background: none; font-size: 0.9rem; padding: 4px 8px; border-radius: 6px; }
        .action-btn:hover { background: #e9ecef; }
        .detail-container { display: none; }
        .list-container { display: block; }
        .active-view .list-container { display: none; }
        .active-view .detail-container { display: block; }
        .detail-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .divider { border-bottom: 2px dashed #ddd; margin: 12px 0; }
        .detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.95rem; }
        .detail-total { font-size: 1.3rem; font-weight: 700; color: var(--primary); background: #fff9e8; padding: 10px; border-radius: 8px; border: 2px solid var(--accent); }
        .pagination-wrap { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 20px; }
        .page-btn { border: 1px solid #ddd; background: white; border-radius: 6px; padding: 4px 10px; font-size: 0.9rem; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .empty-state { text-align: center; padding: 50px 20px; color: #888; }
        .badge-customer { background: var(--secondary); color: white; border-radius: 12px; padding: 2px 8px; font-size: 0.75rem; }
        dialog { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); padding: 0; max-width: 420px; width: 90%; }
        dialog::backdrop { background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>
<!-- 🔐 PAGE PROTECTION -->
<script>
function checkAuth() {
  const isLoggedIn = (sessionStorage.getItem("cueclubLoggedIn") === "true" || sessionStorage.getItem("currentStaff") !== null);
  if (!isLoggedIn) { window.location.replace("login.html"); }
}
checkAuth();
</script>

<!-- Header -->
<div class="header-bar d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center">
        <a href="dashboard.html" class="back-link" id="mainBackBtn"><i class="fas fa-arrow-left"></i></a>
        <h5 class="mb-0" id="pageTitle"><i class="fas fa-file-invoice me-2"></i> Bills & History</h5>
    </div>
    <button class="btn btn-sm btn-light" onclick="refreshData()">
        <i class="fas fa-sync-alt"></i>
    </button>
</div>

<div class="container px-3 mt-4" id="mainWrapper">

    <!-- BILL LIST VIEW -->
    <div class="list-container">
        <!-- Search & Filters -->
        <div class="search-box mb-3">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="form-control" placeholder="Search bill #, name, or mobile..." onkeyup="filterBills()">
        </div>

        <div class="d-flex flex-wrap gap-2 mb-4">
            <select id="dateFilter" class="filter-select" onchange="filterBills()">
                <option value="today">📅 Today</option>
                <option value="week">📅 This Week</option>
                <option value="month">📅 This Month</option>
                <option value="all" selected>📅 All Time</option>
            </select>
            <select id="statusFilter" class="filter-select" onchange="filterBills()">
                <option value="all" selected>All Status</option>
                <option value="paid">✅ Paid</option>
                <option value="credit">⚠️ Credit</option>
                <option value="pending">⏳ Partial</option>
            </select>
        </div>

        <!-- Bill Count -->
        <p class="small text-muted mb-3" id="resultCount">Loading bills...</p>

        <!-- Bill List -->
        <div id="billList">
            <!-- Rendered by JavaScript -->
        </div>

        <!-- Pagination -->
        <div class="pagination-wrap" id="paginationArea">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- BILL DETAIL VIEW -->
    <div class="detail-container" id="detailView">
        <button class="btn btn-sm btn-secondary mb-3" onclick="goBackToList()">
            <i class="fas fa-arrow-left me-1"></i> Back to Bill List
        </button>

        <div class="detail-card">
            <!-- Bill Header -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">🧾 Invoice</h5>
                <span class="bill-number" id="detailBillNo">—</span>
            </div>
            
            <div class="row mb-3">
                <div class="col-7">
                    <p class="mb-1"><i class="fas fa-calendar-day me-2"></i> <span id="detailDate">—</span></p>
                    <p class="mb-1"><i class="fas fa-clock me-2"></i> <span id="detailTime">—</span></p>
                    <p class="mb-1"><i class="fas fa-map-marker-alt me-2"></i> <span id="detailTable">—</span></p>
                </div>
                <div class="col-5 text-end">
                    <p class="mb-1">
                        <span class="badge-customer" id="detailCustomerName">Guest</span>
                    </p>
                    <p class="small text-muted mb-0" id="detailCustomerMobile">—</p>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Bill Items -->
            <div id="detailItems">
                <div class="detail-row">
                    <span>Table Charge</span>
                    <span id="detailTableCharge">Rs. 0.00</span>
                </div>
                <div class="detail-row">
                    <span>Products</span>
                    <span id="detailProducts">Rs. 0.00</span>
                </div>
                <div class="detail-row small text-muted">
                    <span>&nbsp;&nbsp;</span>
                    <span id="detailProductList"></span>
                </div>
                <div class="divider"></div>
                <div class="detail-row">
                    <strong>Subtotal</strong>
                    <strong id="detailSubtotal">Rs. 0.00</strong>
                </div>
                <div class="detail-row text-success">
                    <span>🏷️ Discount (<span id="detailDiscountPct">0</span>%)</span>
                    <span>- Rs. <span id="detailDiscountAmt">0.00</span></span>
                </div>
                <div class="divider"></div>
                <div class="detail-row detail-total">
                    <span>💰 GRAND TOTAL</span>
                    <span id="detailGrandTotal">Rs. 0.00</span>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Payment Info -->
            <div class="alert alert-success mb-0" id="paymentStatus">
                <div class="d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-check-circle me-2"></i><strong>Paid — Cash</strong></span>
                    <span id="detailPaidAmount">Rs. 0.00</span>
                </div>
            </div>
            <div class="alert alert-warning mb-0 d-none" id="partialPaymentStatus">
                <div class="d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-clock me-2"></i><strong>Partial Payment</strong></span>
                    <span id="partialInfo">Paid: Rs. 0.00<br>Balance: Rs. 0.00</span>
                </div>
            </div>
            <div class="alert alert-danger mb-0 d-none" id="creditStatus">
                <div class="d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-exclamation-triangle me-2"></i><strong>Credit / Owing</strong></span>
                    <span id="creditInfo">Due: Rs. 0.00</span>
                </div>
            </div>

        </div>

        <!-- Action Buttons -->
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary flex-grow-1" onclick="printBill()">
                <i class="fas fa-print me-1"></i> Print
            </button>
            <button class="btn btn-success flex-grow-1" onclick="shareWhatsApp()">
                <i class="fab fa-whatsapp me-1"></i> WhatsApp
            </button>
            <button class="btn btn-outline-secondary flex-grow-1" onclick="downloadPDF()">
                <i class="fas fa-file-pdf me-1"></i> PDF
            </button>
        </div>
        <button class="btn btn-outline-secondary w-100 mt-2" onclick="editBill()">
            <i class="fas fa-edit me-1"></i> Edit Bill / Record Payment
        </button>
    </div>

</div>

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({

    }[character]));
}

function loadBills() {
    try {

function getFilteredBills() {
    const query = document.getElementById("searchInput").value.trim().toLowerCase();

    const status = document.getElementById("statusFilter").value;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const weekStart = new Date(today);
    weekStart.setDate(today.getDate() - ((today.getDay() + 6) % 7));
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

    return allBills.filter(bill => {
        const billNo = bill.billNo || bill.id || "";
        const customer = (bill.customerName || bill.customer || "Guest");
        const mobile = bill.customerMobile || "";
        const searchable = `${billNo} ${customer} ${mobile}`.toLowerCase();
        const matchesQuery = !query || searchable.includes(query);

        const matchesStatus = status === "all" || billStatus === status;
        const dateValue = bill.savedAt || bill.date;
        const billDate = dateValue ? new Date(dateValue) : null;
        const hasValidDate = billDate && !Number.isNaN(billDate.getTime());
        const dateOnly = hasValidDate
            ? new Date(billDate.getFullYear(), billDate.getMonth(), billDate.getDate())
            : null;
        let matchesDate = dateRange === "all";
        if (dateRange === "today") matchesDate = !!dateOnly && dateOnly.getTime() === today.getTime();
        if (dateRange === "week") matchesDate = !!dateOnly && dateOnly >= weekStart && dateOnly <= today;
        if (dateRange === "month") matchesDate = !!dateOnly && dateOnly >= monthStart && dateOnly <= today;
        return matchesQuery && matchesStatus && matchesDate;
    }).sort((a, b) => new Date(b.savedAt || b.date) - new Date(a.savedAt || a.date));
}

function filterBills() {
    currentPage = 1;
    renderBills();
}

function renderBills() {
    const results = getFilteredBills();
    const totalPages = Math.max(1, Math.ceil(results.length / pageSize));

            const statusLabel = status === "paid" ? "Paid" : status === "partial" || status === "pending" ? "Partial" : "Credit";
            const statusClass = status === "paid" ? "status-paid" : status === "partial" || status === "pending" ? "status-pending" : "status-credit";
            const customer = escapeHTML(bill.customerName || bill.customer || "Guest");

            const time = new Date(bill.savedAt || bill.date).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
